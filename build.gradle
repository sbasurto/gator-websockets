plugins {
    id 'application'
}

group = 'gator.websockets'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets.main.java.srcDir 'src'
sourceSets.test.java.srcDir 'test'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

def externalLibDir = findProperty('externalLibDir') ?: '/opt/external3/lib'

dependencies {
    implementation files(
        "$externalLibDir/gator-lib.jar",
        "$externalLibDir/gator-lib-utils.jar"
    )
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.postgresql:postgresql:42.7.3'
}

tasks.register('selfCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gator.websockets.frames.GatorWSOutputFrameSelfCheck'
    jvmArgs '-ea'
}

tasks.named('test') {
    enabled = false
}

tasks.named('check') {
    dependsOn selfCheck
}

application {
    mainClass = 'gator.websockets.GatorWSRunner'
}

tasks.named('jar') {
    archiveFileName = 'gator-websockets.jar'
    destinationDirectory = file('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes 'Main-Class': application.mainClass.get()
    from {
        configurations.runtimeClasspath.collect { it.directory ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
